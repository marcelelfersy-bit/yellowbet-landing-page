name: Daily Digests

on:
  schedule:
    # 03:00 UTC = 06:00 Cyprus EEST (summer) / 05:00 EET (winter)
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  igaming:
    name: iGaming Daily Digest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Compose and send iGaming digest
        env:
          DIGEST_KIND: igaming
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/send_digest.py

  ceo-brief:
    name: CEO Brief Daily
    # Wait for iGaming to finish so we don't compete for the Anthropic API
    # input-tokens-per-minute rate limit (50K ITPM on Tier 1). Run even if
    # iGaming fails, so a transient iGaming error doesn't suppress this one.
    needs: igaming
    if: ${{ always() && needs.igaming.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Wait for Anthropic rate-limit bucket to refill after iGaming run
        # Tier 1 ITPM is a 60s rolling window. Sleeping ~75s after iGaming
        # finishes lets the bucket clear before CEO Brief's first call.
        run: sleep 75
      - name: Compose and send CEO Brief
        env:
          DIGEST_KIND: ceo
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/send_digest.py
