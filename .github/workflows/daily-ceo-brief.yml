name: CEO Brief Daily

on:
  schedule:
    # 03:37 UTC = 06:37 Cyprus EEST (summer) / 05:37 EET (winter)
    # Spaced 30 min after iGaming Daily Digest to keep clear of the
    # Anthropic API Tier 1 50K ITPM rolling rate-limit window. Off-hour
    # minute (xx:37) also dodges GitHub Actions' contested round-hour
    # scheduler queue — runs at xx:00 / xx:30 are more likely to be
    # throttled or skipped during peak times.
    - cron: '37 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ceo-brief:
    name: CEO Brief Daily
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Compose and send CEO Brief
        env:
          DIGEST_KIND: ceo
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/send_digest.py
